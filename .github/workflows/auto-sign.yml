name: 切客纪自动签到

on:
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 执行
    - cron: '0 0 * * *'
    # 每天 UTC 12:00 (北京时间 20:00) 执行（备用）
    - cron: '0 12 * * *'
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      account_index:
        description: '账号索引（留空则全部执行）'
        required: false
        default: ''

jobs:
  auto-sign:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: 🔐 创建配置文件
        env:
          ACCOUNTS_CONFIG: ${{ secrets.ACCOUNTS_CONFIG }}
        run: |
          echo "$ACCOUNTS_CONFIG" > config.json
          chmod 600 config.json
      
      - name: ✅ 执行签到
        run: |
          python3 auto_sign_advanced.py
      
      - name: 📤 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-logs-${{ github.run_number }}
          path: |
            *.log
            config.json
          retention-days: 7
      
      - name: 📊 输出结果
        if: always()
        run: |
          echo "签到任务执行完成"
          echo "执行时间: $(date '+%Y-%m-%d %H:%M:%S')"
